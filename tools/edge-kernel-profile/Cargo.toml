[package]
name = "merkur-edge-kernel-profile"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Diagnostic tools resolve independently and never join release Cargo.lock.
[workspace]

[dependencies]
aya = "=0.14.0"
libc = "0.2"
serde_json = "1"

# Clippy reads the repository's `clippy.toml` from here too. Its timer list is for the
# modules on a latency path, which deny it themselves; this tool is not one.
[lints.clippy]
disallowed_methods = "allow"
