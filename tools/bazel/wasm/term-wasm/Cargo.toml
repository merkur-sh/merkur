# Generated from packages/term-wasm/Cargo.toml by scripts/wasm-artifact-manifests.ts:
# edit that manifest and rerun the script.
[package]
name = "term-wasm-artifact"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "../../../../packages/term-wasm/src/lib.rs"

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
wasm-bindgen = { version = "=0.2.127" }
merkur-codec = { path = "crates/merkur-codec", default-features = false }
merkur-graphics = { path = "crates/merkur-graphics", default-features = false }
merkur-wire = { path = "crates/merkur-wire", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
fontdue = { version = "0.9", default-features = false, features = ["simd", "hashbrown"] }
hashbrown = { version = "0.17" }
unicode-width = { version = "0.2" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
merkur-client = { path = "crates/merkur-client", default-features = false, features = ["wasm"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
minicov = { version = "=0.3.9", default-features = false, features = ["alloc"], optional = true }

[features]
default = ["pgo-train"]
pgo-train = ["dep:minicov"]

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/alacritty-terminal-patch","crates/fontdue-patch","crates/merkur-authorization","crates/merkur-client","crates/merkur-codec","crates/merkur-e2e","crates/merkur-edge-protocol","crates/merkur-fec","crates/merkur-graphics","crates/merkur-wire","crates/vte-patch"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(merkur_fuzz)", "cfg(merkur_libfuzzer)", "cfg(fuzzing_libfuzzer)", "cfg(kani)", "cfg(merkur_sim)"] }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
debug_assert_with_mut_call = "warn"
too_many_arguments = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
panic_in_result_fn = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"
infinite_loop = "warn"
redundant_clone = "warn"
disallowed_methods = "allow"

[patch.crates-io]
fontdue = { path = "crates/fontdue-patch" }
alacritty_terminal = { path = "crates/alacritty-terminal-patch" }
vte = { path = "crates/vte-patch" }
