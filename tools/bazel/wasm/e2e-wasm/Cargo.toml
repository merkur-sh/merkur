# Generated from packages/e2e-wasm/Cargo.toml by scripts/wasm-artifact-manifests.ts:
# edit that manifest and rerun the script.
[package]
name = "e2e-wasm-artifact"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "../../../../packages/e2e-wasm/src/lib.rs"

[dependencies]
merkur-client = { path = "crates/merkur-client", default-features = false, features = ["wasm"] }
merkur-e2e = { path = "crates/merkur-e2e", default-features = false, features = ["wasm"] }
merkur-authorization = { path = "crates/merkur-authorization", default-features = false, features = ["wasm"] }
merkur-wire = { path = "crates/merkur-wire", default-features = false, features = ["wasm"] }
merkur-edge-protocol = { path = "crates/merkur-edge-protocol", default-features = false }
serde_json = { version = "1" }
getrandom = { version = "0.3" }
wasm-bindgen = { version = "=0.2.127" }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/alacritty-terminal-patch","crates/merkur-authorization","crates/merkur-client","crates/merkur-codec","crates/merkur-e2e","crates/merkur-edge-protocol","crates/merkur-fec","crates/merkur-graphics","crates/merkur-wire","crates/vte-patch"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(merkur_fuzz)", "cfg(merkur_libfuzzer)", "cfg(fuzzing_libfuzzer)", "cfg(kani)", "cfg(merkur_sim)"] }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
debug_assert_with_mut_call = "warn"
too_many_arguments = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
panic_in_result_fn = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"
infinite_loop = "warn"
redundant_clone = "warn"
disallowed_methods = "allow"

[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty-terminal-patch" }
vte = { path = "crates/vte-patch" }
