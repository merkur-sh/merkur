# Generated from packages/merkur-authorization/Cargo.toml by scripts/sim-workspace.ts: edit that manifest
# and rerun the script.
[package]
name = "merkur-authorization"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../../../../../packages/merkur-authorization/src/lib.rs"

[dependencies]
merkur-e2e = { path = "../packages-merkur-e2e", "default-features" = false, features = [] }
aes-gcm = { version = "=0.10.3", "default-features" = false, features = ["aes","alloc"] }
base64 = { version = "0.23", "default-features" = false, features = ["alloc"] }
hkdf = { version = "=0.12.4", "default-features" = false }
serde = { version = "1", "default-features" = false, features = ["derive","std"] }
serde_json = { version = "1", "default-features" = false, features = ["std"] }
sha2 = { version = "=0.10.9", "default-features" = false }
subtle = { version = "=2.6.1", "default-features" = false }
zeroize = { version = "=1.9.1", "default-features" = false, features = ["alloc"] }

[features]
default = []
std = ["merkur-e2e/std"]
wasm = ["merkur-e2e/wasm"]

[lints]
workspace = true
