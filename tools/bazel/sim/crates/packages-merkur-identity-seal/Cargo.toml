# Generated from packages/merkur-identity-seal/Cargo.toml by scripts/sim-workspace.ts: edit that manifest
# and rerun the script.
[package]
name = "merkur-identity-seal"
version = "0.1.0"
edition = "2024"
publish = false
build = "../../../../../packages/merkur-identity-seal/build.rs"
links = "merkur_identity_seal"

[lib]
path = "../../../../../packages/merkur-identity-seal/src/lib.rs"

[dependencies]
base64 = { version = "0.23" }
libc = { version = "0.2" }
merkur-e2e = { path = "../packages-merkur-e2e", "default-features" = false, features = ["std"] }
merkur-authorization = { path = "../packages-merkur-authorization", "default-features" = false, features = ["std"] }
ring = { version = "0.17" }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1.8" }

[target.'cfg(target_os = "linux")'.dependencies]
tpm2-protocol = { version = "=1.2.0" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tpm2-protocol = { version = "=1.2.0", optional = true }

[features]
default = []
tpm-sim = ["dep:tpm2-protocol"]

[lints]
workspace = true
