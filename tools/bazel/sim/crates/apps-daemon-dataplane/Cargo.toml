# Generated from apps/daemon/dataplane/Cargo.toml by scripts/sim-workspace.ts: edit that manifest
# and rerun the script.
[package]
name = "merkur-dataplane"
version = "0.1.0"
edition = "2024"
publish = false
build = "../../../../../apps/daemon/dataplane/build.rs"

[lib]
path = "../../../../../apps/daemon/dataplane/src/lib.rs"

[dependencies]
merkur-stun-protocol = { path = "../packages-merkur-stun-protocol", "default-features" = false, features = [] }
portable-pty = { version = "0.9.0" }
libc = { version = "0.2" }
alacritty_terminal = { version = "0.26.0", "default-features" = false, path = "../packages-alacritty-terminal-patch", features = [] }
merkur-identity-seal = { path = "../packages-merkur-identity-seal", "default-features" = false, features = [] }
merkur-authorization = { path = "../packages-merkur-authorization", "default-features" = false, features = ["std"] }
merkur-codec = { path = "../packages-merkur-codec", "default-features" = false, features = [] }
merkur-e2e = { path = "../packages-merkur-e2e", "default-features" = false, features = ["std"] }
merkur-edge-protocol = { path = "../packages-merkur-edge-protocol", "default-features" = false, features = [] }
merkur-fec = { path = "../packages-merkur-fec", "default-features" = false, features = [] }
merkur-graphics = { path = "../packages-merkur-graphics", "default-features" = false, features = [] }
merkur-image-worker = { path = "../packages-merkur-image-worker", "default-features" = false, features = [] }
merkur-trace = { path = "../packages-merkur-trace", "default-features" = false, features = [] }
merkur-wire = { path = "../packages-merkur-wire", "default-features" = false, features = ["std"] }
bytes = { version = "1" }
memchr = { version = "2" }
tokio = { version = "1", features = ["full"] }
crossbeam-channel = { version = "0.5" }
arrayvec = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wtransport = { version = "0.7", features = ["quinn"] }
quinn-proto = { version = "0.11", "default-features" = false }
ring = { version = "0.17" }
subtle = { version = "2.6" }
zeroize = { version = "1.8" }
libcrux-ml-dsa = { version = "=0.0.11", "default-features" = false, features = ["mldsa87"] }
socket2 = { version = "0.6" }
netdev = { version = "0.46" }
if-watch = { version = "=3.2.2", features = ["tokio"] }
base64 = { version = "0.23" }
sha2 = { version = "=0.10.9", "default-features" = false }
tokio-stream = { version = "0.1" }
futures = { version = "0.3" }
anyhow = { version = "1" }

[features]
default = []
tpm-sim = ["merkur-identity-seal/tpm-sim"]

[lints]
workspace = true
