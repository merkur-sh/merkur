# Generated from tools/sim/manifest.toml by scripts/sim-workspace.ts: edit that manifest
# and rerun the script.
[package]
name = "merkur-sim"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../../../tools/sim/src/lib.rs"

[dependencies]
merkur-edge = { path = "crates/apps-edge", "default-features" = false, features = [] }
merkur-dataplane = { path = "crates/apps-daemon-dataplane", "default-features" = false, features = [] }
merkur-client = { path = "crates/packages-merkur-client", "default-features" = false, features = ["std"] }
merkur-client-native = { path = "crates/packages-merkur-client-native", "default-features" = false, features = [] }
merkur-authorization = { path = "crates/packages-merkur-authorization", "default-features" = false, features = ["std"] }
merkur-e2e = { path = "crates/packages-merkur-e2e", "default-features" = false, features = ["std"] }
merkur-wire = { path = "crates/packages-merkur-wire", "default-features" = false, features = ["std"] }
alacritty_terminal = { version = "0.26.0", "default-features" = false, path = "crates/packages-alacritty-terminal-patch", features = [] }
turmoil = { version = "=0.7.2" }
tokio = { version = "1", features = ["io-util","macros","rt","sync","time","test-util"] }
wtransport = { version = "0.7", features = ["quinn"] }
libc = { version = "0.2" }
base64 = { version = "0.22" }
futures = { version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[workspace]
resolver = "3"
members = ["crates/apps-daemon-dataplane", "crates/apps-edge", "crates/packages-alacritty-terminal-patch", "crates/packages-fontdue-patch", "crates/packages-merkur-authorization", "crates/packages-merkur-client", "crates/packages-merkur-client-native", "crates/packages-merkur-codec", "crates/packages-merkur-e2e", "crates/packages-merkur-edge-protocol", "crates/packages-merkur-fec", "crates/packages-merkur-graphics", "crates/packages-merkur-identity-seal", "crates/packages-merkur-image-worker", "crates/packages-merkur-stun-protocol", "crates/packages-merkur-wire", "crates/packages-term-wasm", "crates/packages-vte-patch"]

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(merkur_fuzz)", "cfg(merkur_libfuzzer)", "cfg(fuzzing_libfuzzer)", "cfg(kani)", "cfg(merkur_sim)"]

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
debug_assert_with_mut_call = "warn"
too_many_arguments = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
panic_in_result_fn = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"
infinite_loop = "warn"
redundant_clone = "warn"
disallowed_methods = "allow"

[patch.crates-io]
fontdue = { path = "crates/packages-fontdue-patch" }
alacritty_terminal = { path = "crates/packages-alacritty-terminal-patch" }
vte = { path = "crates/packages-vte-patch" }
wtransport = { path = "vendored/wtransport-patch" }
quinn-proto = { path = "vendored/quinn-proto-patch" }
quinn = { path = "vendored/quinn-patch" }
