#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "cargo-shear"
version = "1.13.2"
authors = ["Boshen <boshenc@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Detect and fix unused/misplaced dependencies from Cargo.toml"
readme = "README.md"
keywords = [
    "cargo",
    "udeps",
    "machete",
    "unused",
    "dependencies",
]
categories = [
    "development-tools",
    "development-tools::cargo-plugins",
]
license = "MIT"
repository = "https://github.com/Boshen/cargo-shear"

[features]
allocator = ["dep:mimalloc-safe"]
default = []

[lib]
name = "cargo_shear"
path = "empty.rs"

[dependencies.anyhow]
version = "1.0.97"

[dependencies.bpaf]
version = "0.9.19"
features = [
    "derive",
    "batteries",
]

[dependencies.cargo_metadata]
version = "0.23.0"

[dependencies.compact_str]
version = "0.9.1"

[dependencies.globset]
version = "0.4.18"
features = ["serde1"]

[dependencies.ignore]
version = "0.4.25"

[dependencies.miette]
version = "7.6"
features = ["fancy-no-backtrace"]
default-features = false

[dependencies.owo-colors]
version = "4.2.3"

[dependencies.pulldown-cmark]
version = "0.13"
features = ["simd"]
default-features = false

[dependencies.ra_ap_syntax]
version = "0.0.340"

[dependencies.rayon]
version = "1.10.0"

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.145"

[dependencies.simdutf8]
version = "0.1.5"

[dependencies.toml]
version = "1.0.0"
features = ["serde"]

[dependencies.toml_edit]
version = "0.25.0"
features = ["parse"]

[target.'cfg(all(not(target_os = "linux"), not(target_os = "freebsd"), not(target_family = "wasm")))'.dependencies.mimalloc-safe]
version = "0.1.50"
features = ["skip_collect_on_exit"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.mimalloc-safe]
version = "0.1.50"
features = [
    "skip_collect_on_exit",
    "local_dynamic_tls",
]
optional = true

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
expect_used = "warn"
missing_assert_message = "warn"
panic_in_result_fn = "warn"
str_to_string = "warn"
struct_excessive_bools = "allow"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.correctness]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.clippy.style]
level = "warn"
priority = -1

[lints.clippy.suspicious]
level = "warn"
priority = -1

[lints.rust]
deprecated = "warn"
elided_lifetimes_in_paths = "warn"
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_casts = "allow"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "allow"

[lints.rust.future_incompatible]
level = "warn"
priority = -1

[lints.rust.nonstandard_style]
level = "warn"
priority = -1

[lints.rust.rust_2018_idioms]
level = "warn"
priority = -1

[lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"
strip = "symbols"

[workspace]
resolver = "3"
