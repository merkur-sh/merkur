
["patch"]

["patch"."crates-io"]

["patch"."crates-io"."alacritty_terminal"]
"path" = "../../../../../packages/alacritty-terminal-patch"

["patch"."crates-io"."fontdue"]
"path" = "../../../../../packages/fontdue-patch"

["patch"."crates-io"."quinn"]
"path" = "../../../../../packages/quinn-patch"

["patch"."crates-io"."quinn-proto"]
"path" = "../../../../../packages/quinn-proto-patch"

["patch"."crates-io"."vte"]
"path" = "../../../../../packages/vte-patch"

["patch"."crates-io"."wtransport"]
"path" = "../../../../../packages/wtransport-patch"

["profile"]

["profile"."fuzz"]
"codegen-units" = 1
"debug-assertions" = true
"inherits" = "dev"
"opt-level" = 3
"overflow-checks" = true

["workspace"]
"members" = ["merkur-wire", "merkur-stun-protocol", "merkur-codec", "merkur-client", "merkur-e2e", "term-wasm"]
"resolver" = "3"

["workspace"."lints"]

["workspace"."lints"."clippy"]
"allow_attributes" = "warn"
"allow_attributes_without_reason" = "warn"
"dbg_macro" = "warn"
"debug_assert_with_mut_call" = "warn"
"disallowed_methods" = "allow"
"infinite_loop" = "warn"
"mem_forget" = "warn"
"multiple_unsafe_ops_per_block" = "warn"
"panic_in_result_fn" = "warn"
"redundant_clone" = "warn"
"todo" = "warn"
"too_many_arguments" = "allow"
"undocumented_unsafe_blocks" = "warn"
"unimplemented" = "warn"
"unnecessary_wraps" = "warn"
"unused_async" = "warn"

["workspace"."lints"."rust"]

["workspace"."lints"."rust"."unexpected_cfgs"]
"check-cfg" = ["cfg(merkur_fuzz)", "cfg(merkur_libfuzzer)", "cfg(fuzzing_libfuzzer)", "cfg(kani)", "cfg(merkur_sim)"]
"level" = "warn"
