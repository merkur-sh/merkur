
["dependencies"]

["dependencies"."arrayvec"]
"default-features" = false
"version" = "0.7.2"

["dependencies"."bitflags"]
"default-features" = false
"optional" = true
"version" = "2.3.3"

["dependencies"."cursor-icon"]
"default-features" = false
"optional" = true
"version" = "1.0.0"

["dependencies"."log"]
"optional" = true
"version" = "0.4.17"

["dependencies"."memchr"]
"default-features" = false
"version" = "2.7.4"

["dependencies"."serde"]
"features" = ["derive"]
"optional" = true
"version" = "1.0.160"

[["example"]]
"name" = "parselog"
"path" = "../../../../../../../packages/vte-patch/examples/parselog.rs"

["features"]
"ansi" = ["log", "cursor-icon", "bitflags"]
"default" = ["std"]
"serde" = ["dep:serde"]
"std" = ["memchr/std"]

["lib"]
"name" = "vte"
"path" = "../../../../../../../packages/vte-patch/src/lib.rs"

["package"]
"authors" = ["Joe Wilm <joe@jwilm.com>", "Christian Duerr <contact@christianduerr.com>"]
"autobenches" = false
"autobins" = false
"autoexamples" = false
"autolib" = false
"autotests" = false
"build" = false
"categories" = ["parsing", "no-std"]
"description" = "Parser for implementing terminal emulators"
"documentation" = "https://docs.rs/vte/"
"edition" = "2021"
"exclude" = ["/.travis.yml"]
"keywords" = ["ansi", "vte", "parser", "terminal"]
"license" = "Apache-2.0 OR MIT"
"name" = "vte"
"readme" = "README.md"
"repository" = "https://github.com/alacritty/vte"
"rust-version" = "1.62.1"
"version" = "0.15.0"

["patch"]

["patch"."crates-io"]

["patch"."crates-io"."alacritty_terminal"]
"path" = "../../../../../../../packages/alacritty-terminal-patch"

["patch"."crates-io"."fontdue"]
"path" = "../../../../../../../packages/fontdue-patch"

["patch"."crates-io"."quinn"]
"path" = "../../../../../../../packages/quinn-patch"

["patch"."crates-io"."quinn-proto"]
"path" = "../../../../../../../packages/quinn-proto-patch"

["patch"."crates-io"."vte"]
"path" = "../../../../../../../packages/vte-patch"

["patch"."crates-io"."wtransport"]
"path" = "../../../../../../../packages/wtransport-patch"

