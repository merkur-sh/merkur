name: Restore verified CI artifacts
description: Consume current-run artifacts without invoking a compiler
inputs:
  scope:
    required: true
    description: Artifact namespace within the workflow run
  native:
    default: 'false'
    description: Also install the browser harness executables
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ci-${{ inputs.scope }}-wasm-${{ github.run_id }}
        path: ${{ runner.temp }}
    - shell: bash
      run: |
        python3 scripts/ci/wasm_artifacts.py restore "$RUNNER_TEMP/wasm.tar"
        bun run scripts/check-wasm-artifacts.ts
    - if: inputs.native == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ci-${{ inputs.scope }}-native-${{ github.run_id }}
        path: ${{ runner.temp }}
    - if: inputs.native == 'true'
      shell: bash
      run: |
        tar -xf "$RUNNER_TEMP/native.tar" -C "$RUNNER_TEMP"
        MERKUR_EDGE_HARNESS_NATIVE_ARTIFACT_MANIFEST="$RUNNER_TEMP/merkur-native/native-artifact-manifest.json" bun run install:e2e-native-artifacts
