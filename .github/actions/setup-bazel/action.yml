name: Acquire the pinned engine and dedicated ledger client
description: Use explicit trusted authority inputs; install no product dependencies or compilers
inputs:
  ledger-origin:
    description: Explicit trusted HTTPS revocation authority, with no embedded credentials
    required: true
  ledger-credential-helper:
    description: Absolute original executable File supplied by the trusted authentication bootstrap
    required: true
  credential-file:
    description: Absolute private BuildBuddy credential source supplied by the trusted bootstrap
    required: true
outputs:
  executable:
    description: Absolute path of the checksum-verified native engine executable
    value: ${{ steps.acquire.outputs.executable }}
  output-user-root:
    description: Case-sensitive owned Bazel storage, selected before any repository materialization
    value: ${{ steps.storage.outputs.output-user-root }}
  storage-state:
    description: Exact self-created storage state for the final always() cleanup step
    value: ${{ steps.storage.outputs.storage-state }}
  ledger-client:
    description: Fresh dedicated bare client validated against the supplied ledger authority
    value: ${{ steps.ledger.outputs.client }}
  credential-file:
    description: The supplied private backend credential File, forwarded without reading its bytes
    value: ${{ inputs.credential-file }}
runs:
  using: composite
  steps:
    - name: Select case-sensitive storage for original upstream archive names
      id: storage
      shell: bash
      run: |
        set -euo pipefail
        python3 -I -B tools/bazel/qualification/storage/storage.py setup \
          --runner-temp "$RUNNER_TEMP" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
    - name: Acquire and verify the engine on the trusted CI control plane
      id: acquire
      shell: bash
      run: |
        set -euo pipefail
        engine_dir="$RUNNER_TEMP/merkur-bazel-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT"
        python3 -I scripts/ci/acquire_bazel.py .github/bazel/engine-pins.json "$engine_dir"
        echo "executable=$engine_dir/bazel" >> "$GITHUB_OUTPUT"
        echo "$engine_dir" >> "$GITHUB_PATH"
    - name: Provision the dedicated authority client through declared acquisition tools
      id: ledger
      shell: bash
      env:
        ENGINE: ${{ steps.acquire.outputs.executable }}
        LEDGER_ORIGIN: ${{ inputs.ledger-origin }}
        LEDGER_HELPER: ${{ inputs.ledger-credential-helper }}
        CREDENTIAL_FILE: ${{ inputs.credential-file }}
      run: |
        set -euo pipefail
        [[ "$ENGINE" == /* && "$LEDGER_HELPER" == /* && "$CREDENTIAL_FILE" == /* ]]
        [[ -f "$CREDENTIAL_FILE" && ! -L "$CREDENTIAL_FILE" ]]
        [[ -n "$LEDGER_ORIGIN" ]]
        client="$RUNNER_TEMP/merkur-ledger-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB.git"
        "$ENGINE" --ignore_all_rc_files --host_jvm_args=-XX:+ExitOnOutOfMemoryError --output_user_root="$BAZEL_OUTPUT_USER_ROOT" run \
          --incompatible_strict_action_env --guard_against_concurrent_changes --remote_verify_downloads \
          --remote_cache= --remote_executor= --disk_cache= \
          --remote_accept_cached=false --remote_upload_local_results=false \
          //scripts:provision_ledger -- --workspace "$GITHUB_WORKSPACE" \
          --directory "$client" --origin "$LEDGER_ORIGIN" --credential-helper "$LEDGER_HELPER"
        echo "client=$client" >> "$GITHUB_OUTPUT"
