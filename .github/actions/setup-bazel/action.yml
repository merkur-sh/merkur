name: Set up Bazel
description: Install Bazel at `.bazelversion` and connect it to the shared remote cache
inputs:
  buildbuddy-api-key:
    description: The remote cache's API key; empty on a fork's pull request, which then builds locally
    default: ''
runs:
  using: composite
  steps:
    # The Xcode `.xcode-version` names, whose macOS 26 SDK declares CryptoKit's
    # SecureEnclave.MLDSA87 for the Secure Enclave bridge. Bazel's macOS actions name the SDK by
    # its real path, so it moves to where Xcodes installs it on a workstation, which then reads
    # these jobs' results from the remote cache.
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        version=$(cat .xcode-version)
        sudo mv "/Applications/Xcode_${version%.0}.app" "/Applications/Xcode-$version.app"
        sudo xcode-select --switch "/Applications/Xcode-$version.app"
    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      # No repository cache: a runner downloads the archives a build needs from their sources,
      # faster than restoring every toolchain's.
      with:
        bazelisk-cache: true
    # The module lockfile the last job on this OS wrote, whose module extensions Bazel then
    # replays rather than evaluates (crate_universe's alone took 41 s). Bazel re-evaluates any
    # extension whose recorded inputs changed. It stays out of Git because crate_universe records
    # the vendored crates by absolute path, which is the same on every runner of one OS.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: MODULE.bazel.lock
        key: bazel-module-lock-${{ runner.os }}-${{ github.sha }}
        restore-keys: bazel-module-lock-${{ runner.os }}-
    # CI is the remote cache's only writer (`--config=ci`).
    - if: inputs.buildbuddy-api-key != ''
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: |
        printf 'common --config=ci\ncommon --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" > .bazelrc.local
    # A fork's pull request has no key: the commands that name `--config=remote-cache` read no
    # remote cache there, rather than one that refuses them.
    - if: inputs.buildbuddy-api-key == ''
      shell: bash
      run: printf 'common:remote-cache --remote_cache=\n' > .bazelrc.local
