name: Set up Merkur
description: Install locked dependencies and only the toolchains this job uses
inputs:
  rust:
    description: Activate the pinned Rust toolchain
    default: 'true'
  rust-cache:
    description: Restore compilation dependencies for a job that invokes Cargo
    default: 'true'
  cache-key:
    description: Explicit compilation profile for reusable artifact builders
    default: ''
  browser:
    description: Install Chromium, Redis and the Linux virtual display
    default: 'false'
  wasm-toolchain:
    description: Install the pinned WASM build tools and matching LLVM
    default: 'false'
  bazel:
    description: Install Bazel at `.bazelversion` and connect it to the shared remote cache
    default: 'false'
  buildbuddy-api-key:
    description: The remote cache's API key; empty on a fork's pull request, which then builds locally
    default: ''
runs:
  using: composite
  steps:
    # The Secure Enclave bridge compiles against CryptoKit's SecureEnclave.MLDSA87, which the
    # macOS 26 SDK declares; the image's default Xcode carries the macOS 15 SDK.
    - if: runner.os == 'macOS' && (inputs.rust == 'true' || inputs.bazel == 'true')
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_26.3.app
    - if: inputs.bazel == 'true'
      uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-cache: true
        repository-cache: true
    # CI is the remote cache's only writer (`--config=ci`).
    - if: inputs.bazel == 'true' && inputs.buildbuddy-api-key != ''
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: |
        printf 'common --config=ci\ncommon --remote_header=x-buildbuddy-api-key=%s\n' "$BUILDBUDDY_API_KEY" > .bazelrc.local
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    # pnpm installs at `packageManager` and caches its store by `pnpm-lock.yaml`; Bun, the
    # runtime and test runner, is the release `.bun-version` names.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show active-toolchain
    - name: Cache Rust dependencies
      if: inputs.rust == 'true' && inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # `rust:lint` keeps Clippy's metadata in its own directory so it can run beside a
        # test build; both directories hold dependency artifacts worth restoring.
        workspaces: |
          . -> target/rust
          . -> target/clippy
        shared-key: ${{ inputs.cache-key }}
        # Keep compiler profiles separate by job; never cache test verdicts.
        cache-bin: 'false'
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - if: runner.os == 'Linux' && inputs.rust == 'true' && inputs.rust-cache == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
    - if: runner.os == 'Linux' && inputs.wasm-toolchain == 'true'
      shell: bash
      # The profile-guided term-wasm build needs the clang of the pinned Rust's
      # LLVM (23); Ubuntu's own is older. apt.llvm.org only under its pinned key.
      run: |
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.key"
        gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.key" | grep -qx 'fpr:::::::::6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
        sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg "$RUNNER_TEMP/llvm.key"
        codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
        sudo apt-get update
        sudo apt-get install -y clang-23 lld-23 llvm-23
        echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.browser == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - if: runner.os == 'Linux' && inputs.browser == 'true'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends redis-server libvulkan1 mesa-vulkan-drivers xvfb xauth
    - name: Cache pinned wasm-pack executable
      if: inputs.wasm-toolchain == 'true'
      id: wasm-pack
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/wasm-pack
        key: wasm-pack-0.15.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
    - if: inputs.wasm-toolchain == 'true' && steps.wasm-pack.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-pack --version 0.15.0 --locked
    # scripts/wasm-toolchain.ts compiles every wasm32 crate with Homebrew LLVM on
    # macOS (Apple clang has no WebAssembly backend).
    - if: inputs.wasm-toolchain == 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install llvm
    - name: Cache lockfile-pinned wasm-bindgen tools
      if: inputs.wasm-toolchain == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tools/wasm-bindgen
        key: wasm-bindgen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
