name: Set up Merkur
description: Install locked dependencies and only the toolchains this job uses
inputs:
  rust:
    description: Activate the pinned Rust toolchain
    default: 'true'
  rust-cache:
    description: Restore compilation dependencies for a job that invokes Cargo
    default: 'true'
  cache-key:
    description: Explicit compilation profile for reusable artifact builders
    default: ''
  browser:
    description: Install Chromium, Redis and the Linux virtual display
    default: 'false'
  bazel:
    description: Install Bazel at `.bazelversion` and connect it to the shared remote cache
    default: 'false'
  buildbuddy-api-key:
    description: The remote cache's API key; empty on a fork's pull request, which then builds locally
    default: ''
runs:
  using: composite
  steps:
    # The Xcode `.xcode-version` names, whose macOS 26 SDK declares CryptoKit's
    # SecureEnclave.MLDSA87 for the Secure Enclave bridge. Bazel's macOS actions name the SDK by
    # its real path, so it moves to where Xcodes installs it on a workstation, which then reads
    # these jobs' results from the remote cache.
    - if: runner.os == 'macOS' && (inputs.rust == 'true' || inputs.bazel == 'true')
      shell: bash
      run: |
        version=$(cat .xcode-version)
        sudo mv "/Applications/Xcode_${version%.0}.app" "/Applications/Xcode-$version.app"
        sudo xcode-select --switch "/Applications/Xcode-$version.app"
    # The LLVM repository decodes its release with the host's xz (`tools/bazel/llvm/distribution.bzl`),
    # which the macOS image does not list.
    - if: runner.os == 'macOS' && inputs.bazel == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: brew install xz
    - if: inputs.bazel == 'true'
      uses: ./.github/actions/setup-bazel
      with:
        buildbuddy-api-key: ${{ inputs.buildbuddy-api-key }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    # pnpm installs at `packageManager` and caches its store by `pnpm-lock.yaml`; Bun, the
    # runtime and test runner, is the release `.bun-version` names.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show active-toolchain
    - name: Cache Rust dependencies
      if: inputs.rust == 'true' && inputs.rust-cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # The Cargo subcommands that analyze the workspace (Kani, bolero, the dependency audits)
        # build into `.cargo/config.toml`'s target directory.
        workspaces: |
          . -> target/rust
        shared-key: ${{ inputs.cache-key }}
        # Keep compiler profiles separate by job; never cache test verdicts.
        cache-bin: 'false'
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - if: runner.os == 'Linux' && inputs.rust == 'true' && inputs.rust-cache == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.browser == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
    - if: runner.os == 'Linux' && inputs.browser == 'true'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends redis-server libvulkan1 mesa-vulkan-drivers xvfb xauth
