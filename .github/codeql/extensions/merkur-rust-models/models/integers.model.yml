      - ["<core::i128>::from_le_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i128>::from_ne_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::isize>::from_be_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::isize>::from_le_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
