      - ["<core::usize>::from_be_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::usize>::from_le_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::usize>::from_ne_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i16>::from_be_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i16>::from_le_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i16>::from_ne_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i32>::from_be_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i32>::from_le_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
      - ["<core::i32>::from_ne_bytes", "Argument[0].Element", "ReturnValue", "taint", "manual"]
