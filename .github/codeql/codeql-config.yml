# Code scanning configuration for `.github/workflows/codeql.yml`. The workflow chooses each
# language's query suite and installs that language's model pack.
name: Merkur
paths-ignore:
  # Deliberately vulnerable fixtures the query tests read.
  - tools/codeql/*/test
  - spikes
  - '**/test-vectors'
  - '**/node_modules'
  - '**/dist'
  - '**/target'
  - '**/pkg'
