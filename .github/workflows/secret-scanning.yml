name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read scanner version
        id: scanner
        run: jq -r '"version=" + .version' scripts/trufflehog.json >> "$GITHUB_OUTPUT"
      # A push that creates a ref has no previous commit, and the action then scans every commit
      # the ref reaches; a forced push names a previous commit the ref no longer holds, which
      # the scanner cannot resolve. The commits the default branch holds were scanned when they
      # were pushed there, so either push is scanned from where the ref leaves that branch.
      - name: Select a new or rewritten ref's own commits
        id: range
        if: github.event_name == 'push' && (github.event.created || github.event.forced) && github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if git merge-base --is-ancestor "$GITHUB_SHA" "$base"; then
            echo "covered=true" >> "$GITHUB_OUTPUT"
          else
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan for secrets
        if: steps.range.outputs.covered != 'true'
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          version: ${{ steps.scanner.outputs.version }}
          extra_args: --results=verified,unknown --fail-on-scan-errors
