name: Assurance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: assurance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-smoke:
    name: Fixed-seed parser safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup show active-toolchain
      - name: Cache parser build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            test-results/bolero/workspace/target
          key: assurance-parser-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/bolero/Cargo.lock', 'tools/bolero/targets.json') }}-${{ github.sha }}
          restore-keys: |
            assurance-parser-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/bolero/Cargo.lock', 'tools/bolero/targets.json') }}-
      - name: Run fixed-seed replay and synthetic valid-frame checks
        run: |
          mkdir -p test-results/assurance/parser-smoke
          sha256sum Cargo.lock > test-results/assurance/parser-smoke/production-lock.sha256
          trap 'sha256sum --check test-results/assurance/parser-smoke/production-lock.sha256' EXIT
          python3 tools/bolero/instrumentation_test.py 2>&1 | tee test-results/assurance/parser-smoke/instrumentation.log
          bun run test:fuzz:smoke 2>&1 | tee test-results/assurance/parser-smoke/smoke.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: parser-smoke-results-${{ github.run_id }}
          path: test-results/assurance/parser-smoke/
          retention-days: 7
  ownership:
    name: Ownership proofs and race models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup show active-toolchain
      - name: Cache Loom build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target/assurance/ownership/debug
          key: assurance-loom-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/ownership-proofs/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            assurance-loom-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/ownership-proofs/Cargo.lock') }}-
      - name: Cache pinned Kani compiler and executables
        id: kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani/kani-0.68.0
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: assurance-kani-0.68.0-nightly-2026-08-21-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.kani.outputs.cache-hit != 'true'
        name: Install pinned Kani
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/kani-install
        run: bun run setup:kani
      - name: Prepare the verifier's separate pinned toolchain
        run: cargo kani setup
      - name: Run Loom models and check the proof adapters
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/ownership
        run: |
          mkdir -p test-results/assurance/ownership
          bun run test:ownership 2>&1 | tee test-results/assurance/ownership/loom.log
          cargo clippy --locked --all-targets --manifest-path tools/ownership-proofs/Cargo.toml -- -D warnings 2>&1 | tee test-results/assurance/ownership/clippy.log
      - name: Verify bounded counter custody
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/kani
        run: bun run test:ownership:kani 2>&1 | tee test-results/assurance/ownership/kani.log
      - name: Verify all five removed-safeguard controls
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/negative-controls
        run: bun run test:ownership:negative 2>&1 | tee test-results/assurance/ownership/negative-controls.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ownership-results-${{ github.run_id }}
          path: test-results/assurance/ownership/
          retention-days: 7
  bounded-proofs:
    name: Bounded parser and state proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup show active-toolchain
      - name: Cache pinned Kani compiler and executables
        id: kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani/kani-0.68.0
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: assurance-kani-0.68.0-nightly-2026-08-21-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.kani.outputs.cache-hit != 'true'
        name: Install pinned Kani
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/kani-install
        run: bun run setup:kani
      - name: Prepare the verifier's separate pinned toolchain
        run: cargo kani setup
      - name: Prove every listed harness within its budget
        run: |
          mkdir -p test-results/assurance/bounded-proofs
          sha256sum Cargo.lock > test-results/assurance/bounded-proofs/production-lock.sha256
          trap 'sha256sum --check test-results/assurance/bounded-proofs/production-lock.sha256' EXIT
          bun run test:fuzz:kani 2>&1 | tee test-results/assurance/bounded-proofs/kani.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bounded-proof-results-${{ github.run_id }}
          path: test-results/assurance/bounded-proofs/
          retention-days: 7
  simulation:
    name: Network simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup show active-toolchain
      - name: Cache simulator build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            test-results/sim/workspace/target
          key: assurance-simulation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/sim/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            assurance-simulation-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/sim/Cargo.lock') }}-
      - name: Replay every scenario seed and recorded regression
        run: |
          mkdir -p test-results/assurance/simulation
          sha256sum Cargo.lock > test-results/assurance/simulation/production-lock.sha256
          trap 'sha256sum --check test-results/assurance/simulation/production-lock.sha256' EXIT
          bun run test:sim 2>&1 | tee test-results/assurance/simulation/scenarios.log
      - name: Sweep 200 random seeds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # A failing seed is recorded here; the artifact carries it to a commit.
          trap 'cp tools/sim/regressions.json test-results/assurance/simulation/' EXIT
          bun run test:sim:sweep 200 2>&1 | tee test-results/assurance/simulation/sweep.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: simulation-results-${{ github.run_id }}
          path: test-results/assurance/simulation/
          retention-days: 14
  kernel-tool:
    name: Linux diagnostic tool checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/kernel-tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Cache Linux diagnostic build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target/assurance/kernel-tool/debug
          key: assurance-kernel-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/edge-kernel-profile/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            assurance-kernel-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/edge-kernel-profile/Cargo.lock') }}-
      # These checks require no BPF, perf-event, tracefs or network privileges.
      # Kernel/CPU measurements run separately on a representative Linux host.
      - name: Compile diagnostic tool and verify tracepoint layouts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/assurance-python-cache
        run: |
          mkdir -p test-results/assurance/kernel-tool
          cargo clippy --locked --all-targets --manifest-path tools/edge-kernel-profile/Cargo.toml -- -D warnings 2>&1 | tee test-results/assurance/kernel-tool/clippy.log
          cargo test --locked --all-targets --manifest-path tools/edge-kernel-profile/Cargo.toml 2>&1 | tee test-results/assurance/kernel-tool/layout.log
          python3 scripts/profile-edge-linux_test.py 2>&1 | tee test-results/assurance/kernel-tool/completed-work.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kernel-tool-results-${{ github.run_id }}
          path: test-results/assurance/kernel-tool/
          retention-days: 7
  fuzz-campaign:
    name: Bounded coverage-guided parser campaign
    needs: parser-smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: rustup show active-toolchain
      - name: Cache coverage-guided build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            test-results/bolero/workspace/target
          key: assurance-libfuzzer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/bolero/Cargo.lock', 'tools/bolero/targets.json') }}-${{ github.sha }}
          restore-keys: |
            assurance-libfuzzer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'tools/bolero/Cargo.lock', 'tools/bolero/targets.json') }}-
      - name: Cache pinned cargo-bolero executable
        id: bolero
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-bolero
          key: assurance-cargo-bolero-0.13.5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'package.json') }}
      - if: steps.bolero.outputs.cache-hit != 'true'
        name: Install pinned coverage-guided driver
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/assurance/bolero-install
        run: bun run setup:fuzz
      - name: Retain parser mutation corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test-results/bolero/corpus
          key: assurance-corpus-paths-${{ hashFiles('tools/bolero/targets.json', 'tools/bolero/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            assurance-corpus-paths-${{ hashFiles('tools/bolero/targets.json', 'tools/bolero/Cargo.lock') }}-
      - name: Run 10000 mutations per target with bounded input and memory
        run: |
          mkdir -p test-results/assurance/fuzz-campaign
          sha256sum Cargo.lock > test-results/assurance/fuzz-campaign/production-lock.sha256
          trap 'sha256sum --check test-results/assurance/fuzz-campaign/production-lock.sha256' EXIT
          bun run test:fuzz:campaign 10000 2>&1 | tee test-results/assurance/fuzz-campaign/campaign.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fuzz-campaign-results-${{ github.run_id }}
          path: |
            test-results/assurance/fuzz-campaign/
            test-results/bolero/corpus/
            test-results/bolero/crashes/
          retention-days: 14
  required:
    name: Assurance required
    if: always()
    needs: [parser-smoke, ownership, bounded-proofs, simulation, kernel-tool, fuzz-campaign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PARSER_RESULT: ${{ needs.parser-smoke.result }}
      OWNERSHIP_RESULT: ${{ needs.ownership.result }}
      PROOFS_RESULT: ${{ needs.bounded-proofs.result }}
      SIMULATION_RESULT: ${{ needs.simulation.result }}
      KERNEL_TOOL_RESULT: ${{ needs.kernel-tool.result }}
      CAMPAIGN_RESULT: ${{ needs.fuzz-campaign.result }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require every applicable assurance check
        run: |
          test "$PARSER_RESULT" = success
          test "$OWNERSHIP_RESULT" = success
          test "$PROOFS_RESULT" = success
          test "$SIMULATION_RESULT" = success
          test "$KERNEL_TOOL_RESULT" = success
          if [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$CAMPAIGN_RESULT" = success
          else
            test "$CAMPAIGN_RESULT" = skipped
          fi
