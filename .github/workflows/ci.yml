name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.plan.outputs.source }}
      native: ${{ steps.plan.outputs.native }}
      integration: ${{ steps.plan.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit's first parent is the base used for selection.
          fetch-depth: 2
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
      - id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run scripts/ci-plan.ts
  wasm:
    needs: plan
    if: needs.plan.outputs.source == 'true'
    uses: ./.github/workflows/ci-artifacts.yml
    with:
      kind: wasm
      scope: required
  browser-native:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    uses: ./.github/workflows/ci-artifacts.yml
    with:
      kind: native
      scope: required
  source:
    needs: [plan, wasm]
    if: always() && needs.plan.result == 'success' && (needs.wasm.result == 'success' || needs.plan.outputs.source == 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MERKUR_GATE_CACHE: '0'
      BENCH_HEADED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Source tests inspect archived renderer commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup-merkur
        with:
          rust: ${{ needs.plan.outputs.source }}
          rust-cache: 'false'
          browser: ${{ needs.plan.outputs.source }}
      - if: needs.plan.outputs.source == 'true'
        uses: ./.github/actions/restore-ci-artifacts
        with:
          scope: required
      - name: Static gates
        if: needs.plan.outputs.source == 'true'
        run: |
          bun run check:types
          bun run check:lint
          bun run check:latency-boundaries
          bun run check:span-lifetimes
          bun run check:span-attributes
          bun run check:dead
      # The pre-commit hook runs the ratchet on every staged diff; this catches a commit that
      # skipped it, measured against what the push or pull request actually changed. The push
      # that creates the branch has no commit before it, so there is nothing to measure against.
      - name: Ratchet
        if: needs.plan.outputs.source == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.created))
        env:
          RATCHET_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:ratchet --base "$RATCHET_BASE"
      # The whole tree against the committed baseline: the pre-commit hook holds only staged files.
      - name: Anti-slop baseline
        if: needs.plan.outputs.source == 'true'
        run: bun run check:slop
      - run: bun run check:docs
      - if: needs.plan.outputs.source == 'true'
        run: xvfb-run -a bun run test:unit
      - if: needs.plan.outputs.source == 'true'
        run: python3 -m unittest discover -s scripts/ci -p '*_test.py'
      - if: needs.plan.outputs.source == 'true'
        run: shellcheck scripts/ci/*.sh .claude/skills/release/scripts/release.sh
      - name: Cache pinned actionlint
        if: needs.plan.outputs.source == 'true'
        id: actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: actionlint-1.7.12-${{ runner.os }}-${{ runner.arch }}
      - if: needs.plan.outputs.source == 'true' && steps.actionlint.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Workflow validation
        if: needs.plan.outputs.source == 'true'
        run: |
          # GitHub supports queue:max; actionlint 1.7.12 has not added that key.
          "$(go env GOPATH)/bin/actionlint" -ignore 'unexpected key "queue" for "concurrency" section'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.plan.outputs.source == 'true'
        with:
          name: source-results-${{ github.run_id }}
          overwrite: true
          path: test-results/verification/
          retention-days: 7
  native:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
      - run: bun run rust:lint
      - run: bun run rust:test
      - run: bun run build:image-worker
      - run: 'cargo test --locked -p merkur-dataplane -- --ignored real_helper::'
  integration:
    needs: [plan, wasm, browser-native]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PW_E2E_GPU: swiftshader
      HEADED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
        with:
          rust-cache: 'false'
          browser: 'true'
      - uses: ./.github/actions/restore-ci-artifacts
        with:
          scope: required
          native: 'true'
      - run: bun run test:dragonfly
      - run: xvfb-run -a bun run test:e2e --reporter=line,json --max-failures=1
        env:
          PW_E2E_OUTPUT_DIR: test-results/ci-auth
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci-auth.json
      - run: xvfb-run -a bun run test:e2e:rebind --reporter=line,json --max-failures=1
        env:
          PW_E2E_OUTPUT_DIR: test-results/ci-rebind
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci-rebind.json
      - run: xvfb-run -a bun run test:e2e:transport:reorder --reporter=line,json --max-failures=1
        env:
          PW_E2E_OUTPUT_DIR: test-results/ci-reorder
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci-reorder.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-results-${{ github.run_id }}
          overwrite: true
          path: |
            test-results/
            !test-results/verification/web-artifacts/**
          retention-days: 7
  transport:
    needs: [plan, wasm, browser-native]
    if: needs.plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PW_E2E_GPU: swiftshader
      HEADED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
        with:
          rust-cache: 'false'
          browser: 'true'
      - uses: ./.github/actions/restore-ci-artifacts
        with:
          scope: required
          native: 'true'
      - name: Functional transport shard
        env:
          SHARD: ${{ matrix.shard }}/2
          PW_E2E_OUTPUT_DIR: test-results/ci-transport
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci-transport.json
        # --functional already enables fullyParallel: Playwright partitions
        # individual tests, including the large input matrix, across runners.
        run: xvfb-run -a bun run test:e2e:transport --functional --workers=1 --shard="$SHARD" --reporter=line,json --max-failures=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: transport-${{ matrix.shard }}-results-${{ github.run_id }}
          overwrite: true
          path: |
            test-results/
            !test-results/verification/web-artifacts/**
          retention-days: 7
  required:
    name: CI required
    if: always()
    needs: [plan, wasm, source, native, browser-native, integration, transport]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Require every selected lane to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE: ${{ needs.plan.outputs.source }}
          NATIVE: ${{ needs.plan.outputs.native }}
          INTEGRATION: ${{ needs.plan.outputs.integration }}
        run: bun run scripts/ci-required.ts
