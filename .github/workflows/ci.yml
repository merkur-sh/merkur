name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  artifacts:
    uses: ./.github/workflows/ci-artifacts.yml
    secrets: inherit
  # Every unit test and static gate: Bazel runs the ones whose inputs changed and answers the
  # rest from the remote cache.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
          rust-cache: 'false'
          bazel: 'true'
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      # The Chromium the browser tests launch is Bazel's. On Linux the runner supplies its shared
      # libraries, Mesa's Vulkan drivers and a virtual display, and the WebGPU tests run headed
      # on it. The display's number is fixed: it is part of every test's cache key.
      - if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          bazel test //... --test_env=DISPLAY=:99 --test_env=BENCH_HEADED=1
      - if: runner.os == 'macOS'
        run: bazel test //...
  workflow:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/ci -p '*_test.py'
      - run: shellcheck scripts/ci/*.sh .claude/skills/release/scripts/release.sh
      - name: Cache pinned actionlint
        id: actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: actionlint-1.7.12-${{ runner.os }}-${{ runner.arch }}
      - if: steps.actionlint.outputs.cache-hit != 'true'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Workflow validation
        run: |
          # GitHub supports queue:max and the ubuntu-26.04 images; actionlint 1.7.12 knows
          # neither the key nor the labels.
          "$(go env GOPATH)/bin/actionlint" -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'label "ubuntu-26\.04(-arm)?" is unknown'
  integration:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: auth
            script: test:e2e
          - suite: rebind
            script: test:e2e:rebind
          - suite: reorder
            script: test:e2e:transport:reorder
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      PW_E2E_GPU: swiftshader
      HEADED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
          bazel: 'true'
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          browser: 'true'
      # Cache hits: the artifacts job built both. The harnesses sync the native programs again
      # themselves, as Bazel's no-op.
      - run: bun run build:wasm && bun run build:native
      - if: matrix.suite == 'auth'
        run: bun run test:dragonfly
      - env:
          SCRIPT: ${{ matrix.script }}
          PW_E2E_OUTPUT_DIR: test-results/ci-${{ matrix.suite }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci-${{ matrix.suite }}.json
        run: xvfb-run -a bun run "$SCRIPT" --reporter=line,json --max-failures=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ matrix.suite }}-results-${{ github.run_id }}
          overwrite: true
          path: |
            test-results/
            !test-results/verification/web-artifacts/**
          retention-days: 7
  transport:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      PW_E2E_GPU: swiftshader
      HEADED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
          bazel: 'true'
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          browser: 'true'
      # Cache hits: the artifacts job built both. The harnesses sync the native programs again
      # themselves, as Bazel's no-op.
      - run: bun run build:wasm && bun run build:native
      - name: Functional transport shard
        env:
          SHARD: ${{ matrix.shard }}/6
          PW_E2E_OUTPUT_DIR: test-results/ci-transport
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ci-transport.json
        # --functional already enables fullyParallel: Playwright partitions
        # individual tests, including the large input matrix, across runners.
        run: xvfb-run -a bun run test:e2e:transport --functional --workers=1 --shard="$SHARD" --reporter=line,json --max-failures=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: transport-${{ matrix.shard }}-results-${{ github.run_id }}
          overwrite: true
          path: |
            test-results/
            !test-results/verification/web-artifacts/**
          retention-days: 7
  required:
    name: CI required
    if: always()
    needs: [artifacts, test, workflow, integration, transport]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null \
            || { echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }
