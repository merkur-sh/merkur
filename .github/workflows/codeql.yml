name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # New upstream queries reach an unchanged tree once a week.
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            queries: ./tools/codeql/javascript/src/merkur-javascript.qls
            models: tools/codeql/javascript/models
          - language: rust
            queries: ./tools/codeql/rust/src/merkur-rust.qls
            models: tools/codeql/rust/models
          - language: actions
            queries: security-extended
          - language: python
            queries: security-extended
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL stores every model pack in `.github/codeql/extensions` in the database and checks
      # each row against the analyzed language's predicates, whatever library the row names. A job
      # installs its own language's pack there and no other.
      - if: matrix.models != ''
        env:
          MODELS: ${{ matrix.models }}
        run: mkdir -p .github/codeql/extensions && cp -R "$MODELS" .github/codeql/extensions/
      # The extractor reads the workspace through Cargo, which needs the pinned toolchain.
      - if: matrix.language == 'rust'
        run: rustup show active-toolchain
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: ${{ matrix.queries }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  query-tests:
    name: Query tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # The same bundle the analysis runs, so the queries compile against the same libraries.
      - id: codeql
        uses: github/codeql-action/setup-codeql@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      # Each test extracts its fixture, runs its query and compares the alerts with the
      # `$ Alert` and `$ Source` annotations: a query that stops firing, or fires on a fixture's
      # safe case, fails here.
      - name: Run the query and model tests
        env:
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
        run: '"$CODEQL" test run --threads=0 tools/codeql/javascript/test tools/codeql/rust/test'
