name: Build deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Require public build pins
        env:
          RELEASE_PIN: ${{ vars.MERKUR_RELEASE_MLDSA87_PUBLIC_KEY }}
          OPAQUE_PIN: ${{ vars.MERKUR_OPAQUE_SERVER_PUBLIC_KEY }}
        run: |
          test -n "$RELEASE_PIN"
          test -n "$OPAQUE_PIN"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=deployment
          build-args: |
            BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
            MERKUR_BUILD_COMMIT=${{ github.sha }}
            MERKUR_RELEASE_MLDSA87_PUBLIC_KEY=${{ vars.MERKUR_RELEASE_MLDSA87_PUBLIC_KEY }}
            VITE_MERKUR_OPAQUE_SERVER_PUBLIC_KEY=${{ vars.MERKUR_OPAQUE_SERVER_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Preserve bundle modes in archive
        run: tar -czf deployment.tar.gz -C deployment .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}
          path: deployment.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

