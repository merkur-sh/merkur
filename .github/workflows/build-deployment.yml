name: Build deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build the unsigned deployment
        env:
          RELEASE_PIN: ${{ vars.MERKUR_RELEASE_MLDSA87_PUBLIC_KEY }}
          OPAQUE_PIN: ${{ vars.MERKUR_OPAQUE_SERVER_PUBLIC_KEY }}
        run: |
          # A deployment names the release its daemons must run; main has none, so this
          # build proves the deployment with the placeholder the release build uses untagged.
          identity=(
            "--//tools/bazel/release:commit=$GITHUB_SHA"
            "--//tools/bazel/release:version=v0.0.0"
            "--//tools/bazel/release:release_public_key=$RELEASE_PIN"
            "--//tools/bazel/release:opaque_pin=$OPAQUE_PIN"
          )
          bazel build --config=release "${identity[@]}" //tools/bazel/release:deployment
          cp "$(bazel info --config=release "${identity[@]}" execution_root)/$(bazel cquery --config=release "${identity[@]}" --output=files //tools/bazel/release:deployment)" deployment.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}
          path: deployment.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

