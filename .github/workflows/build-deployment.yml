name: Build deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Require public build pins
        env:
          RELEASE_PIN: ${{ vars.MERKUR_RELEASE_MLDSA87_PUBLIC_KEY }}
          OPAQUE_PIN: ${{ vars.MERKUR_OPAQUE_SERVER_PUBLIC_KEY }}
        run: |
          test -n "$RELEASE_PIN"
          test -n "$OPAQUE_PIN"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=deployment
          build-args: |
            BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1@sha256:ecfaec9ed6d810b56388c508f4121597bfbba70d41a6dfeee4d8cad5f295fc32
            MERKUR_BUILD_COMMIT=${{ github.sha }}
            MERKUR_RELEASE_MLDSA87_PUBLIC_KEY=${{ vars.MERKUR_RELEASE_MLDSA87_PUBLIC_KEY }}
            VITE_MERKUR_OPAQUE_SERVER_PUBLIC_KEY=${{ vars.MERKUR_OPAQUE_SERVER_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Preserve bundle modes in archive
        run: tar -czf deployment.tar.gz -C deployment .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-${{ github.sha }}
          path: deployment.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

