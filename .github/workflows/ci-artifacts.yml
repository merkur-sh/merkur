name: Build CI artifacts
# The WebAssembly packages and the native programs the browser suites run, built once into the
# remote cache with the commands every consumer runs (`bun run build:wasm`, the harnesses'
# `bun run build:native`), so each consuming job's own build is a cache hit.
on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: bazel build //tools/bazel/wasm:sync
      - run: bazel build --config=release //tools/bazel/native:sync
