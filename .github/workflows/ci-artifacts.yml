name: Build CI artifacts
on:
  workflow_call:
    inputs:
      kind:
        type: string
        required: true
      scope:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate artifact kind
        env:
          KIND: ${{ inputs.kind }}
        run: test "$KIND" = wasm || test "$KIND" = native
      - uses: ./.github/actions/setup-merkur
        with:
          wasm-toolchain: ${{ inputs.kind == 'wasm' }}
          cache-key: ci-${{ inputs.kind }}
      - name: Build and attest WASM
        if: inputs.kind == 'wasm'
        run: |
          bun run build:wasm
          bun run sync:wasm
          bun run build:graphics-codec-probe
          bun run scripts/check-wasm-artifacts.ts
          # PGO already built zstd-fixture; retain it for source tests too.
          python3 scripts/ci/wasm_artifacts.py pack "$RUNNER_TEMP/wasm.tar"
      - name: Build and attest browser executables
        if: inputs.kind == 'native'
        run: |
          bun run prepare:e2e-native-artifacts --output="$RUNNER_TEMP/merkur-native"
          tar -cf "$RUNNER_TEMP/native.tar" -C "$RUNNER_TEMP" merkur-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ inputs.scope }}-${{ inputs.kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ inputs.kind }}.tar
          if-no-files-found: error
          # Full reruns replace the same-run bundle; failed-job reruns consume it.
          overwrite: true
          retention-days: 1
