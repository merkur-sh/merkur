name: Extended CI
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  artifacts:
    uses: ./.github/workflows/ci-artifacts.yml
    secrets: inherit
  native:
    strategy:
      fail-fast: false
      matrix:
        suite: [test:natlab, test:tpm-sim, test:graphics:long]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bazel builds what each suite runs: the TPM and graphics suites are Bazel tests, and the
      # NAT lab's endpoints run in its Linux containers.
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
          bazel: 'true'
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Run native suite
        env:
          SUITE: ${{ matrix.suite }}
        run: bun run "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: extended-native-${{ strategy.job-index }}-${{ github.run_id }}
          overwrite: true
          path: test-results/
          retention-days: 7
  browser:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        suite: [test:e2e:transport:impaired:functional, test:e2e:edge-topology]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      PW_E2E_GPU: swiftshader
      HEADED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
          bazel: 'true'
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          browser: 'true'
      # Cache hits: the artifacts job built both.
      - run: bun run build:wasm && bun run build:native
      - name: Run suite
        env:
          SUITE: ${{ matrix.suite }}
        run: xvfb-run -a bun run "$SUITE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: extended-browser-${{ strategy.job-index }}-${{ github.run_id }}
          overwrite: true
          path: |
            test-results/
            !test-results/verification/web-artifacts/**
          retention-days: 7
