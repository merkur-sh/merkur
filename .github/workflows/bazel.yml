name: Bazel

# Development builds and tests through Bazel against BuildBuddy's remote cache, which CI and
# every workstation share: an unchanged action or test is downloaded, never rerun. On `main`
# this starts once CI has finished with the same commit, so it never holds runner slots CI's
# shards are queued for.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A cold build fills the shared cache for every later run, so a newer commit queues behind it
# instead of discarding it.
concurrency:
  group: bazel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Bazel test (linux-x86_64)
    # A cancelled CI run was superseded by a newer push, whose own completion is built.
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The runner image's preinstalled SDKs leave too little disk for the Bun runtime's
      # from-source build; none of them is used here.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Acquire the pinned engine
        run: |
          python3 -I scripts/ci/acquire_bazel.py .github/bazel/engine-pins.json "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP/bazel" >> "$GITHUB_PATH"
      # Every Bazel command in this job, the capture generators' own included, reads and fills
      # the shared cache.
      - name: Bind the remote cache credential
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          test -n "$BUILDBUDDY_API_KEY"
          umask 077
          printf 'common --remote_header=x-buildbuddy-api-key=%s\ncommon --config=remote-cache\n' \
            "$BUILDBUDDY_API_KEY" > .bazelrc.local
      - uses: ./.github/actions/setup-merkur
        with:
          rust: 'false'
      # The generated captures follow the tree they describe: the build below tests them as
      # regenerated here, and the `captures` job commits whatever changed.
      - name: Regenerate the Bazel captures
        run: |
          bun tools/bazel/bun/import-inventory.ts "$RUNNER_TEMP/import-inventory.json"
          cp "$RUNNER_TEMP/import-inventory.json" tools/bazel/bun/import-inventory.json
          python3 -I -B tools/bazel/bun/generate_graph.py
          python3 -I -B tools/bazel/rust/refresh_graph.py --bazel "$(command -v bazel)"
          python3 -I -B tools/bazel/rust/refresh_source_inputs.py --bazel "$(command -v bazel)"
          CARGO_BAZEL_REPIN=true bazel mod deps --lockfile_mode=update
          git diff --binary -- . ':!.bazelrc.local' > "$RUNNER_TEMP/captures.patch"
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-captures-${{ github.run_id }}
          path: ${{ runner.temp }}/captures.patch
          if-no-files-found: error
          retention-days: 1
      # The generated Rust units were captured for a Darwin execution host, and the ninja and
      # tmux SDKs build with the declared GCC 14.3 bookworm toolchain; a hosted Ubuntu runner is
      # neither (.github/bazel/execution-pools.md), so those packages wait for a qualified pool.
      - name: Build and test
        run: |
          bazel test --config=development --config=ci --config=linux_x64 --keep_going -- //... \
            -//tools/bazel/rust/units/... -//tools/bazel/tools/ninja_sdk/... -//tools/bazel/tools/shell_sdk/...
      - name: Disk after the build
        if: always()
        run: df -h /

  captures:
    name: Commit refreshed Bazel captures
    needs: test
    # The patch exists once regeneration succeeded, whatever the tests concluded.
    if: always() && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The only job holding a write token, and it runs no repository code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        id: patch
        continue-on-error: true
        with:
          name: bazel-captures-${{ github.run_id }}
          path: ${{ runner.temp }}/captures
      - if: steps.patch.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Apply onto main and push
        if: steps.patch.outcome == 'success'
        env:
          PATCH: ${{ runner.temp }}/captures/captures.patch
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ ! -s "$PATCH" ]]; then
            echo 'Captures are current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A newer push can have moved main; the patch then lands three-way, and a capture a
          # later run regenerates anyway is left to that run.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            git apply --3way --index "$PATCH" || { echo 'Patch no longer applies; a later run regenerates it.'; exit 0; }
            git diff --cached --quiet && { echo 'Captures are current.'; exit 0; }
            git commit --quiet -m "Refresh the Bazel captures for ${SOURCE_SHA:0:8}"
            git push --quiet origin HEAD:main && exit 0
          done
          exit 1
