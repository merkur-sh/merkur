name: Deploy site

# merkur.sh. The site holds no auth, cookies or keys, so unlike the app it is
# deployed from main without offline signing (docs/releases.md): each commit
# whose CI run on main ends green, and on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  # A run CI started names the commit CI tested; a dispatch names main's own.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # The site only moves to the newest commit of main. A CI run that ends after
  # main has moved on, or an old one run again, deploys nothing: the newest
  # commit's own run does.
  newest:
    # CI's run for a push to main of this repository, ended green, or a
    # dispatch. A pull request's run deploys nothing, whatever its branch is called.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" = "$DEPLOY_SHA" ]; then echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: newest
    if: needs.newest.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Its own environment: `production` admits release tags only, and its
    # Railway token reaches the app. This one admits `main` and holds a token
    # for the site service alone.
    environment: site
    permissions:
      contents: read
      actions: read
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SITE_SERVICE_ID: ${{ vars.RAILWAY_SITE_SERVICE_ID }}
      SITE_ORIGIN: ${{ vars.MERKUR_SITE_ORIGIN }}
      SITE_API_ORIGIN: ${{ vars.MERKUR_SERVER_ORIGIN }}
      SITE_RYBBIT_SITE_ID: ${{ vars.MERKUR_SITE_RYBBIT_SITE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Require the deployment inventory and a green CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test -n "$RAILWAY_SITE_SERVICE_ID"
          test -n "$SITE_ORIGIN"
          test -n "$SITE_API_ORIGIN"
          test -n "$SITE_RYBBIT_SITE_ID"
          test "$HAS_RAILWAY_TOKEN" = true
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$DEPLOY_SHA" \
            --event push --json conclusion --jq '.[0].conclusion')
          test "$conclusion" = success
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # The dependency stage is the root Dockerfile's, so the app build's cache
      # (the default scope) supplies it; the site writes its own scope so
      # neither build evicts the other's index.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/site/Dockerfile
          target: artifacts
          platforms: linux/amd64
          outputs: type=local,dest=site-deployment
          build-args: |
            MERKUR_SITE_ORIGIN=${{ vars.MERKUR_SITE_ORIGIN }}
            MERKUR_SITE_API_ORIGIN=${{ vars.MERKUR_SERVER_ORIGIN }}
            MERKUR_SITE_RYBBIT_SITE_ID=${{ vars.MERKUR_SITE_RYBBIT_SITE_ID }}
          cache-from: |
            type=gha,scope=site
            type=gha
          cache-to: type=gha,mode=max,scope=site
      - name: Serve the built bytes locally and record what production must present
        run: |
          # A header's value; names compare without case (HTTP/1.1 here, HTTP/2 live).
          header() { tr -d '\r' < "$2" | grep -i "^$1:" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//'; }
          test -x site-deployment/site-server
          PORT=18080 RYBBIT_HOST=https://app.rybbit.io TRUSTED_PROXY_HOPS=1 \
            site-deployment/site-server site-deployment/dist > "$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          curl --fail --silent --show-error --retry 50 --retry-delay 0 --retry-connrefused \
            --retry-max-time 20 --output /dev/null http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error --head --header 'Accept-Encoding: br' \
            http://127.0.0.1:18080/ > "$RUNNER_TEMP/built.headers"
          # The installer command the page prints follows this to the app.
          curl --silent --show-error --head http://127.0.0.1:18080/install > "$RUNNER_TEMP/install.headers"
          kill "$server_pid"
          grep -q '^HTTP/1.1 308' "$RUNNER_TEMP/install.headers"
          test "$(header location "$RUNNER_TEMP/install.headers")" = "$SITE_API_ORIGIN/install"
          test "$(header content-encoding "$RUNNER_TEMP/built.headers")" = br
          header content-security-policy "$RUNNER_TEMP/built.headers" > "$RUNNER_TEMP/built.csp"
          header etag "$RUNNER_TEMP/built.headers" > "$RUNNER_TEMP/built.etag"
          test -s "$RUNNER_TEMP/built.csp"
          test -s "$RUNNER_TEMP/built.etag"
          cat "$RUNNER_TEMP/built.csp" "$RUNNER_TEMP/built.etag"
      # release.yml's 5.12.1 predates `railway cdn`.
      - run: npm install --global @railway/cli@5.62.1
      - name: Deploy, purge the CDN's HTML, and prove production serves these bytes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          : "${RAILWAY_TOKEN:?}"
          header() { tr -d '\r' < "$2" | grep -i "^$1:" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//'; }
          scope=(--project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SITE_SERVICE_ID")
          # The service builds apps/site/Dockerfile's default (runner) stage from an
          # upload of that file, its ignore file and the exported bytes, nothing else.
          railway variable set RAILWAY_DOCKERFILE_PATH=apps/site/Dockerfile "${scope[@]}" --skip-deploys >/dev/null
          upload_dir="$RUNNER_TEMP/site-upload"
          mkdir -p "$upload_dir/apps/site"
          cp apps/site/Dockerfile apps/site/Dockerfile.dockerignore "$upload_dir/apps/site/"
          cp -R site-deployment "$upload_dir/site-deployment"
          railway up "$upload_dir" --path-as-root --no-gitignore --detach --json "${scope[@]}" \
            --message "site ($DEPLOY_SHA)" > "$RUNNER_TEMP/railway-up.json"
          deployment_id=$(jq -er '.deploymentId' "$RUNNER_TEMP/railway-up.json")
          for attempt in $(seq 1 60); do
            deploy_state=$(railway deployment list "${scope[@]}" --json \
              | jq -r --arg id "$deployment_id" '.[] | select(.id == $id) | .status')
            case "$deploy_state" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED|SKIPPED) exit 1 ;;
            esac
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 10
          done
          # Only now: the previous container has stopped serving, so a page the
          # CDN refetches can only name assets this build has (docs/releases.md).
          railway cdn purge html "${scope[@]}"
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --head --header 'Accept-Encoding: br' "$SITE_ORIGIN/" \
              > "$RUNNER_TEMP/live.headers"
            if [ "$(header etag "$RUNNER_TEMP/live.headers")" = "$(cat "$RUNNER_TEMP/built.etag")" ]; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          test "$(header content-security-policy "$RUNNER_TEMP/live.headers")" = "$(cat "$RUNNER_TEMP/built.csp")"
          test "$(header content-encoding "$RUNNER_TEMP/live.headers")" = br
          # The CDN keys on Accept-Encoding: a client without Brotli never gets its bytes.
          curl --fail --silent --show-error --head --header 'Accept-Encoding: identity' "$SITE_ORIGIN/" \
            > "$RUNNER_TEMP/live-identity.headers"
          test -z "$(header content-encoding "$RUNNER_TEMP/live-identity.headers")"
          # The `www.` alias answers with the same address on the bare host.
          www_origin="https://www.${SITE_ORIGIN#https://}"
          curl --silent --show-error --head "$www_origin/security" > "$RUNNER_TEMP/www.headers"
          test "$(header location "$RUNNER_TEMP/www.headers")" = "$SITE_ORIGIN/security"
          cat "$RUNNER_TEMP/live.headers"
