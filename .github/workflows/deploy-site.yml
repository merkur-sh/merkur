name: Deploy site

# merkur.sh. The site holds no auth, cookies or keys, so unlike the app it is
# deployed from main without offline signing (docs/releases.md): each commit
# whose CI run on main ends green, and on demand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  # A run CI started names the commit CI tested; a dispatch names main's own.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # The site only moves to the newest commit of main. A CI run that ends after
  # main has moved on, or an old one run again, deploys nothing: the newest
  # commit's own run does.
  newest:
    # CI's run for a push to main of this repository, ended green, or a
    # dispatch. A pull request's run deploys nothing, whatever its branch is called.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" = "$DEPLOY_SHA" ]; then echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: newest
    if: needs.newest.outputs.sha != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # Its own environment: `production` admits release tags only, and its key
    # reaches the app host as root. This one admits `main`, and its key can only
    # run the app host's site installer (scripts/ci/install-site-release.sh).
    environment: site
    permissions:
      contents: read
      actions: read
    env:
      SITE_ORIGIN: ${{ vars.MERKUR_SITE_ORIGIN }}
      SITE_API_ORIGIN: ${{ vars.MERKUR_SERVER_ORIGIN }}
      SITE_RYBBIT_SITE_ID: ${{ vars.MERKUR_SITE_RYBBIT_SITE_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Require the deployment inventory and a green CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_SSH_KEY != '' }}
          HAS_PURGE_TOKEN: ${{ secrets.SITE_CLOUDFLARE_PURGE_TOKEN != '' }}
        run: |
          test -n "$CLOUDFLARE_ZONE_ID"
          test -n "$SITE_ORIGIN"
          test -n "$SITE_API_ORIGIN"
          test -n "$SITE_RYBBIT_SITE_ID"
          test "$HAS_SITE_DEPLOY_KEY" = true
          test "$HAS_PURGE_TOKEN" = true
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$DEPLOY_SHA" \
            --event push --json conclusion --jq '.[0].conclusion')
          test "$conclusion" = success
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build the site
        run: |
          identity=(
            "--//tools/bazel/release:site_origin=$SITE_ORIGIN"
            "--//tools/bazel/release:site_api_origin=$SITE_API_ORIGIN"
            "--//tools/bazel/release:site_rybbit_site_id=$SITE_RYBBIT_SITE_ID"
          )
          bazel build --config=release "${identity[@]}" //tools/bazel/release:site
          mkdir site-deployment
          tar -xzf "$(bazel info --config=release "${identity[@]}" execution_root)/$(bazel cquery --config=release "${identity[@]}" --output=files //tools/bazel/release:site)" -C site-deployment
      - name: Serve the built bytes locally and record what production must present
        run: |
          # A header's value; names compare without case (HTTP/1.1 here, HTTP/2 live).
          header() { tr -d '\r' < "$2" | grep -i "^$1:" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//'; }
          test -x site-deployment/site-server
          PORT=18080 RYBBIT_HOST=http://10.10.0.3:3001 TRUSTED_PROXY_HOPS=2 \
            site-deployment/site-server site-deployment/dist > "$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          curl --fail --silent --show-error --retry 50 --retry-delay 0 --retry-connrefused \
            --retry-max-time 20 --output /dev/null http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error --head --header 'Accept-Encoding: br' \
            http://127.0.0.1:18080/ > "$RUNNER_TEMP/built.headers"
          # The installer command the page prints follows this to the app.
          curl --silent --show-error --head http://127.0.0.1:18080/install > "$RUNNER_TEMP/install.headers"
          kill "$server_pid"
          grep -q '^HTTP/1.1 308' "$RUNNER_TEMP/install.headers"
          test "$(header location "$RUNNER_TEMP/install.headers")" = "$SITE_API_ORIGIN/install"
          test "$(header content-encoding "$RUNNER_TEMP/built.headers")" = br
          header content-security-policy "$RUNNER_TEMP/built.headers" > "$RUNNER_TEMP/built.csp"
          header etag "$RUNNER_TEMP/built.headers" > "$RUNNER_TEMP/built.etag"
          test -s "$RUNNER_TEMP/built.csp"
          test -s "$RUNNER_TEMP/built.etag"
          cat "$RUNNER_TEMP/built.csp" "$RUNNER_TEMP/built.etag"
      - name: Deploy and prove production serves these bytes
        env:
          SITE_DEPLOY_SSH_KEY: ${{ secrets.SITE_DEPLOY_SSH_KEY }}
          SITE_CLOUDFLARE_PURGE_TOKEN: ${{ secrets.SITE_CLOUDFLARE_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          header() { tr -d '\r' < "$2" | grep -i "^$1:" | head -n 1 | sed 's/^[^:]*:[[:space:]]*//'; }
          work="$RUNNER_TEMP/app-host"
          mkdir -m 0700 "$work"
          printf '%s\n' "$SITE_DEPLOY_SSH_KEY" > "$work/id"
          chmod 0600 "$work/id"
          jq -r '(.hosts[], .app) | "\(.address) \(.sshHostKey)"' deploy/service-hosts.json > "$work/known_hosts"
          # The key's only command is the host's site installer, which takes the
          # commit as its argument and the deployment on stdin.
          tar -C site-deployment -czf - . \
            | ssh -i "$work/id" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$work/known_hosts" "root@$(jq -r .app.address deploy/service-hosts.json)" \
              "$DEPLOY_SHA" > "$RUNNER_TEMP/site.json"
          jq -e --arg commit "$DEPLOY_SHA" --arg digest "$(sha512sum site-deployment/site-server | cut -d' ' -f1)" \
            '.commit == $commit and ."site-server" == $digest and .active == "active"' "$RUNNER_TEMP/site.json"
          # Only now: the previous build has stopped serving, so a page the CDN
          # refetches can only name assets this build has (docs/releases.md).
          curl --fail --silent --show-error -X POST \
            --header "Authorization: Bearer $SITE_CLOUDFLARE_PURGE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg host "${SITE_ORIGIN#https://}" '{hosts: [$host, "www." + $host]}')" \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            | jq -e '.success' > /dev/null
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --head --header 'Accept-Encoding: br' "$SITE_ORIGIN/" \
              > "$RUNNER_TEMP/live.headers"
            if [ "$(header etag "$RUNNER_TEMP/live.headers")" = "$(cat "$RUNNER_TEMP/built.etag")" ]; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          test "$(header content-security-policy "$RUNNER_TEMP/live.headers")" = "$(cat "$RUNNER_TEMP/built.csp")"
          test "$(header content-encoding "$RUNNER_TEMP/live.headers")" = br
          # The CDN keys on Accept-Encoding: a client without Brotli never gets its bytes.
          curl --fail --silent --show-error --head --header 'Accept-Encoding: identity' "$SITE_ORIGIN/" \
            > "$RUNNER_TEMP/live-identity.headers"
          test -z "$(header content-encoding "$RUNNER_TEMP/live-identity.headers")"
          # The `www.` alias answers with the same address on the bare host.
          www_origin="https://www.${SITE_ORIGIN#https://}"
          curl --silent --show-error --head "$www_origin/security" > "$RUNNER_TEMP/www.headers"
          test "$(header location "$RUNNER_TEMP/www.headers")" = "$SITE_ORIGIN/security"
          cat "$RUNNER_TEMP/live.headers"
