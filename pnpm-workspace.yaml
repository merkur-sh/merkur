packages:
  - apps/*
  - packages/*

catalog:
  '@elysia/eden': 2.0.0-beta.6
  '@noble/post-quantum': 0.7.1
  '@serenity-kit/opaque': 1.1.0
  effect: 4.0.2
  elysia: 2.0.0-beta.27
  exact-mirror: 1.2.6
  typebox: 1.3.36

linkWorkspacePackages: true
autoInstallPeers: true
strictPeerDependencies: false
onlyBuiltDependencies: []

# `@solidjs/web`'s JSX types import `csstype` without declaring it.
packageExtensions:
  '@solidjs/web':
    dependencies:
      csstype: 3.2.3
