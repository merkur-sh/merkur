# The application server's database (sqld) and Dragonfly on app-1, run from
# /srv/app. Both listen on loopback only; the server and the website are systemd
# units (merkur-server.service, merkur-site.service). /etc/merkur/data.env holds
# SQLD_AUTH_JWT_KEY and DRAGONFLY_PASSWORD and never leaves the host.
name: app

services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
    restart: unless-stopped
    env_file: /etc/merkur/data.env
    environment:
      SQLD_NODE: primary
      SQLD_DB_PATH: /var/lib/sqld/data.sqld
      SQLD_HTTP_LISTEN_ADDR: '[::]:8080'
    ports:
      - 127.0.0.1:8880:8080
    # The image runs as UID 666, which owns this directory.
    volumes:
      - /var/lib/merkur/sqld:/var/lib/sqld

  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
    restart: unless-stopped
    env_file: /etc/merkur/data.env
    command: >-
      sh -c 'exec dragonfly --logtostderr --requirepass="$$DRAGONFLY_PASSWORD" --bind 0.0.0.0'
    ports:
      - 127.0.0.1:6379:6379
    ulimits:
      memlock: -1
