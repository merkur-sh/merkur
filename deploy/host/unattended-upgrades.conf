// /etc/apt/apt.conf.d/52merkur-unattended-upgrades on every host. Debian's
// unattended-upgrades installs security updates daily; an update that needs a
// reboot (a kernel above all) protects nothing until the host boots into it, so
// the host reboots itself at 03:30 UTC whenever /var/run/reboot-required exists,
// and at no other time. Every service is a systemd unit or a compose service with
// a restart policy, so a reboot costs the time to boot and reconnect.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "03:30";
