[build]
target-dir = "target/rust"

# The two vendored `[patch.crates-io]` crates carry upstream's generated
# manifests, which declare `rust-version` (vte 1.62.1, alacritty_terminal
# 1.85.0). Under resolver v3 that is the workspace floor, so a plain
# `cargo update` resolves the *whole* tree down to what Rust 1.62 could build —
# socket2 0.5, url 2.5.2, uuid 1.11, windows-sys 0.48, and dozens more, all
# silent downgrades. The real floor is rust-toolchain.toml, so tell the resolver
# to ignore those declarations rather than hand-editing generated manifests.
[resolver]
incompatible-rust-versions = "allow"

# getrandom 0.3 refuses to pick a backend for wasm32-unknown-unknown implicitly:
# the target has no ambient entropy source, so the choice has to be explicit.
# `wasm_js` routes to `crypto.getRandomValues`, which is what the browser Noise
# handshake needs for its ephemeral and static keys.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# merkur-fec has one SIMD lane per target and no runtime dispatch. On x86_64
# that lane is SSSE3 (`pshufb`), and the crate refuses to compile without it,
# so every x86_64 build enables it. SSSE3 dates from 2006 (Core 2); every
# Hetzner and Fly host has it. It is the x86_64 CPU floor for the daemon, the
# edge and STUN. A `RUSTFLAGS` environment variable replaces this list.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+ssse3"]
# rustdoc does not inherit rustflags when compiling documentation tests.
rustdocflags = ["-C", "target-feature=+ssse3"]
