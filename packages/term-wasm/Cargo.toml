[package]
name = "term-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
wasm-bindgen = "=0.2.127"
merkur-codec = { path = "../merkur-codec" }
merkur-graphics = { path = "../merkur-graphics" }
merkur-wire = { path = "../merkur-wire", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
fontdue = "0.9"
hashbrown = "0.17"
unicode-width = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
merkur-client = { path = "../merkur-client" }

[features]
# The instrumented training build of the profile-guided terminal
# (`//tools/bazel/wasm/term-wasm:profile`): its training entry points, and the
# LLVM profile runtime it links. The shipped artifact never enables it.
pgo-train = ["dep:minicov"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
merkur-client = { path = "../merkur-client", default-features = false, features = ["wasm"] }
# Feature switch for the browser core's Noise RNG; the backend is selected by
# the root target rustflags and obtains entropy from crypto.getRandomValues.
getrandom = { version = "0.3", features = ["wasm_js"] }
# Exact: minicov carries a compiler-rt profile runtime for one raw profile
# format. 0.3.9 is raw version 11, which rustc 1.99.0's LLVM 23 writes; 0.3.8
# is version 10 and traps on that profile. Move it with the toolchain.
minicov = { version = "=0.3.9", default-features = false, features = ["alloc"], optional = true }

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[lints]
workspace = true
