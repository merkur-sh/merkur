[package]
name = "zstd-fixture"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Development-only fixture generator for scripts/bench-display-encoding.ts. The
# browser decoder is decompress-only by design, so compressed decoder input has
# to come from the Rust side that actually produces display frames — and from
# the same C implementation the daemon encodes with, so the benchmark measures
# the exact bytes the browser will receive.
[[bin]]
name = "zstd-fixture"
path = "src/main.rs"

[dependencies]
zstd = { version = "0.13", features = ["experimental"] }
merkur-codec = { path = "../merkur-codec" }

[lints]
workspace = true
