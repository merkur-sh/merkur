[package]
name = "merkur-client-native"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
merkur-authorization = { path = "../merkur-authorization" }
merkur-client = { path = "../merkur-client" }
merkur-edge-protocol = { path = "../merkur-edge-protocol" }
merkur-wire = { path = "../merkur-wire" }
# The viewer's grid: the terminal the browser runs, built for the host.
term-wasm = { path = "../term-wasm" }
# The edge and the dataplane speak through the same patched crate.
wtransport = { version = "0.7" }
bytes = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
# The account API. `rustls-no-provider` with ring installed at startup, as
# `apps/edge` does: the workspace stays free of aws-lc-rs and its C toolchain.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Exactly the OPAQUE inside `@serenity-kit/opaque` 1.1.0, so an account the
# browser registered signs in here with the same password.
opaque-ke = { version = "4.0", features = ["argon2"] }
argon2 = { version = "0.5", features = ["zeroize"] }
generic-array = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { version = "=0.10.9", default-features = false }
subtle = "2.6"
base64 = "0.22"
# Operating-system path changes, as the dataplane watches them.
if-watch = { version = "=3.2.2", features = ["tokio"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"

[dev-dependencies]
# Display frames for the grid's tests, encoded as the daemon encodes them.
merkur-codec = { path = "../merkur-codec" }
tokio = { version = "1", features = ["macros", "net", "rt", "test-util"] }

[lints]
workspace = true
