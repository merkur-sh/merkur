[package]
name = "merkur-identity-seal"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
links = "merkur_identity_seal"

[features]
tpm-sim = ["dep:tpm2-protocol"]

[dependencies]
base64 = "0.23"
libc = "0.2"
merkur-e2e = { path = "../merkur-e2e" }
merkur-authorization = { path = "../merkur-authorization" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
tpm2-protocol = "=1.2.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tpm2-protocol = { version = "=1.2.0", optional = true }

[lints]
workspace = true
