[package]
name = "merkur-authorization"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# The one implementation of Merkur's user-authorization records: root-signed
# delegations, daemon bindings, revocations, account deletions, daemon-link
# claims and approvals, and the password-wrapped user-root envelope. The daemon
# links it natively to verify, the native client to sign, and the browser and
# server reach it through `e2e-wasm`.
[features]
default = ["std"]
# The same split as `merkur-e2e`: native builds take its ring-accelerated
# resolver, `e2e-wasm` takes the pure-Rust one.
std = ["merkur-e2e/std"]
wasm = ["merkur-e2e/wasm"]

[dependencies]
merkur-e2e = { path = "../merkur-e2e", default-features = false }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hkdf = { version = "=0.12.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
