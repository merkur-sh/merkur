[package]
name = "merkur-edge-protocol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# The edge relay's own contract, shared by the edge, the daemon and the native
# client: the routing preface and the splice-control events. Serde only, so the
# relay links no session cryptography.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
