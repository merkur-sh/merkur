[package]
name = "e2e-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
merkur-client = { path = "../merkur-client", default-features = false, features = ["wasm"] }
merkur-e2e = { path = "../merkur-e2e", default-features = false, features = ["wasm"] }
merkur-authorization = { path = "../merkur-authorization", default-features = false, features = ["wasm"] }
merkur-wire = { path = "../merkur-wire", default-features = false, features = ["wasm"] }
merkur-edge-protocol = { path = "../merkur-edge-protocol" }
serde_json = "1"
getrandom = "0.3"
wasm-bindgen = "=0.2.127"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

# Noise ephemeral and static keys need an OS-quality RNG. On wasm32 that is
# `crypto.getRandomValues`, which getrandom only reaches through this backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
