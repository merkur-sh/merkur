# Run behind a TLS reverse proxy. Server secrets live in an external env file;
# the Redis/Dragonfly service is provisioned separately via REDIS_URL, and the
# libSQL database service separately via DB_URL.
#
# The server holds no durable state: its database is a separate service reached
# over the network, which is what lets more than one process share one database
# and keeps the server free to run on more than one machine.
name: merkur-production
services:
  server:
    image: ${MERKUR_IMAGE_REPOSITORY:?set the registry repository}@sha256:${MERKUR_IMAGE_SHA256:?set the independently verified image digest}
    env_file:
      - ${MERKUR_RUNTIME_ENV_FILE:?set the absolute path to the runtime env file}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Needed only before the privilege drop: SETUID/SETGID/SETPCAP for setpriv's
    # own uid/gid switch and bounding-set drop. setpriv then clears every
    # capability, including the bounding and inheritable sets, before exec'ing
    # the server.
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
