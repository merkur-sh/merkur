# This policy covers the resolved workspace graph, including development dependencies.
[graph]
all-features = true

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# Transitive crates legitimately use different major versions. Source and license
# restrictions apply to every resolved version; duplication is not a security finding.
multiple-versions = "allow"
wildcards = "deny"
# Workspace paths name the current checkout rather than a registry version.
allow-wildcard-paths = true
deny = [
  # Release TLS uses rustls/ring, never platform OpenSSL or a native-TLS backend.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
