# Fly.io deploy for the merkur-stun authenticated Binding responder.
#
# STUN is UDP, and Fly's shared IPv4 proxy routes by SNI/Host, so UDP requires a
# DEDICATED IPv4 — the same constraint apps/edge lives under.
#
# This existing single-address deployment answers mapping and changed-port
# probes. It cannot establish address independence on its own. A second Fly
# region shares its anycast IP and does not fix it.
# Full discovery needs two independently routed addresses on the observer host;
# see docs/transport.md and apps/stun/README.md.
#
# Deploy from the repository root:
#   fly deploy --config apps/stun/fly.toml --dockerfile apps/stun/Dockerfile
app = "mercury-stun-tntcl"
primary_region = "fra"

[build]

[env]
  MERKUR_STUN_EGRESS_RATE_MBIT = "1"
  MERKUR_STUN_EGRESS_INTERFACE = "eth0"
  # Multiple ports test port dependence; a single IP cannot prove address independence.
  MERKUR_STUN_PORTS = "3478,3479,3480"
  # Answers CHANGE-PORT only. Never listed in the server's STUN_SERVERS: a
  # daemon's contact ledger discounts a reply from a port it has probed, and on
  # a conntrack NAT the unsolicited reply from an observer port collides with
  # the daemon's later probe to that port and misreads the NAT as symmetric.
  MERKUR_STUN_CHANGE_PORTS = "3481"
  RUST_LOG = "info"

# Binding is stateless.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# One [[services]] block per port: Fly maps external port to internal port, and
# the responder binds each one on its own thread.
[[services]]
  protocol = "udp"
  internal_port = 3478
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3478

[[services]]
  protocol = "udp"
  internal_port = 3479
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3479

[[services]]
  protocol = "udp"
  internal_port = 3480
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3480

# Change-only. Bound and served like the others, but only ever the source of a
# CHANGE-PORT answer.
[[services]]
  protocol = "udp"
  internal_port = 3481
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3481
