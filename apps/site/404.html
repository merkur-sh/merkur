<!doctype html>
<html lang="en" data-rybbit-site="[[rybbit.siteId]]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No page at this address · Merkur</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="[[color.ground]]">
<link rel="icon" href="/src/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/src/fonts/Geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<link rel="stylesheet" href="/src/styles/site.css">
[[part.header]]

<main id="main" class="lost">
  <svg class="retro-stars" aria-hidden="true">[[retrograde.stars]]</svg>
  <div class="retro-sky" data-retrograde aria-hidden="true">
    <svg class="retro-orbit retro-line" aria-hidden="true" viewBox="0 0 1 1" preserveAspectRatio="none" data-retrograde-line><path d="[[retrograde.line]]"/></svg>
    <svg class="retro-orbit retro-lit retro-held" aria-hidden="true" viewBox="0 0 1 1" preserveAspectRatio="none"><path d="[[retrograde.lit]]"/></svg>
    <svg class="retro-orbit retro-tail retro-held" aria-hidden="true" viewBox="0 0 1 1" preserveAspectRatio="none">[[retrograde.tail]]</svg>
    <img class="retro-orb retro-held" src="/src/brand/orb-44.webp" srcset="/src/brand/orb-44.webp 1x, /src/brand/orb-66.webp 2x" width="36" height="36" alt="">
    <canvas class="retro-canvas"></canvas>
    <span class="retro-word serif-i" data-retrograde-word>backwards</span>
  </div>
  <div class="lost-body">
    <p class="lost-code" data-liquid="lost">404</p>
    <div class="lost-copy">
      <h1 class="lost-title">Mercury is in <span class="serif-i">retrograde.</span></h1>
      <p class="lost-deck">Every few months Mercury seems to back up across the sky. This link backed up too.</p>
      <p class="lost-links"><a class="btn-site btn-site-primary" href="[[app.origin]]/" data-rybbit-event="cta_open_app">Back to orbit</a><a class="btn-site btn-site-quiet" href="/">Home</a></p>
    </div>
  </div>
</main>

[[part.footer]]
</body>
</html>
