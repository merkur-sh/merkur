[package]
name = "merkur-keyd"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "merkur-keyd"
path = "src/main.rs"

# Blocking threads over one Unix socket; no async runtime.
[dependencies]
# The capability payload the daemon verifies, and the ML-DSA-87 key that signs it.
merkur-authorization = { path = "../../packages/merkur-authorization" }
# The server half of the OPAQUE inside `@serenity-kit/opaque` 1.1.0.
opaque-ke = "4.0"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { version = "=0.10.9", default-features = false }
# ES256 for the web-push VAPID JWT, as `merkur-e2e` signs P-256.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "arithmetic"] }
ring = "0.17"
base64 = "0.23"
serde_json = "1"
libc = "0.2"
zeroize = "1.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
merkur-e2e = { path = "../../packages/merkur-e2e" }

[lints]
workspace = true
