notes = "Merkur maintains modified local source; upstream registry audits do not certify these patches. Review changes as first-party code."

[policy.vte]
audit-as-crates-io = false
notes = "Merkur maintains modified local source; upstream registry audits do not certify these patches. Review changes as first-party code."

[policy.wtransport]
audit-as-crates-io = false
notes = "Merkur maintains modified local source; upstream registry audits do not certify these patches. Review changes as first-party code."

